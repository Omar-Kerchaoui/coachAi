spring:
  application:
    name: lose10-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      # Flyway is the sole owner of schema (docs/DATABASE.md §5). Hibernate's
      # own validate mode is skipped rather than risk false-positive startup
      # failures on types it doesn't recognize out of the box (e.g. citext).
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  pattern:
    console: "%d{ISO8601} [%X{requestId}] %-5level %logger{36} - %msg%n"

lose10:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    access-token-ttl-minutes: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${AUTH_REFRESH_TOKEN_TTL_DAYS:30}
  ai:
    claude:
      api-key: ${CLAUDE_API_KEY:}
      model: ${CLAUDE_MODEL_ID:claude-sonnet-5}
    context:
      max-recent-messages: ${AI_CONTEXT_MAX_RECENT_MESSAGES:10}
      max-relevant-memories: ${AI_CONTEXT_MAX_RELEVANT_MEMORIES:8}
    rate-limit:
      per-user-per-hour: ${AI_RATE_LIMIT_PER_USER_PER_HOUR:60}
    embedding:
      provider: ${EMBEDDING_PROVIDER:voyage}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL_ID:voyage-3.5}
      dimension: ${EMBEDDING_DIMENSION:1024}
  whatsapp:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  scheduler:
    max-proactive-messages-per-day: ${SCHEDULER_MAX_PROACTIVE_PER_DAY:3}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-signing-secret: ${STRIPE_WEBHOOK_SIGNING_SECRET:}
    price-id-monthly: ${STRIPE_PRICE_ID_MONTHLY:}
    price-id-annual: ${STRIPE_PRICE_ID_ANNUAL:}
    checkout-success-url: ${STRIPE_CHECKOUT_SUCCESS_URL:http://localhost:5173/billing?checkout=success}
    checkout-cancel-url: ${STRIPE_CHECKOUT_CANCEL_URL:http://localhost:5173/pricing?checkout=cancelled}
    portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:5173/billing}
