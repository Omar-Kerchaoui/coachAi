spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:lose10}
    username: ${DATABASE_USER:lose10}
    password: ${DATABASE_PASSWORD:lose10}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
    com.lose10: DEBUG
    org.hibernate.SQL: WARN

lose10:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:local-dev-only-secret-key-not-for-production-use-32bytes+}
